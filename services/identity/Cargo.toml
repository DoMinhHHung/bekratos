[package]
name = "identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "time",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
http = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
argon2 = "0.5"
password-hash = "0.5"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
async-trait = "0.1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.11"
redis = { version = "0.27", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "script",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }
validator = { version = "0.19", features = ["derive"] }
regex = "1"
jsonwebtoken = "9"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
rand_core = "0.6"
chacha20poly1305 = "0.10"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", default-features = false, features = [
    "axum",
    "vendored",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tower = { version = "0.5", features = ["util"] }

# Full LTO + codegen-units=1 peaks at multi-GB RAM and OOMs on small builders
# (Northflank free / shared CI). Thin LTO is enough for a small API binary.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
opt-level = 3

# Even lighter profile if a host still OOMs: build with
#   cargo build --release --profile release-lowmem
[profile.release-lowmem]
inherits = "release"
lto = false
codegen-units = 32
opt-level = 2
strip = true
