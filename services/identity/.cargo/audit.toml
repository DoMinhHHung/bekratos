[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack (timing sidechannel) on `rsa`.
    # No fixed upgrade available. Transitive (sqlx ecosystem); this service
    # does not perform RSA private-key ops on untrusted input (ES256 + Argon2id).
    # https://rustsec.org/advisories/RUSTSEC-2023-0071
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0173 — proc-macro-error2 unmaintained (compile-time only).
    # Transitive proc-macro dependency; not linked into runtime binary logic.
    # Track upstream dependents (e.g. validator stack) for a maintained replacement.
    # https://rustsec.org/advisories/RUSTSEC-2026-0173
    "RUSTSEC-2026-0173",

    # RUSTSEC-2026-0387 — timing variability in crypto-bigint ops.
    # Transitive via p256/jsonwebtoken. No direct dependency.
    # Track upstream; revisit when p256/jsonwebtoken pull fixed range.
    # https://rustsec.org/advisories/RUSTSEC-2026-0387
    "RUSTSEC-2026-0387",

    # RUSTSEC-2025-0134 — rustls-pemfile unmaintained.
    # Transitive only via redis 0.27.x / rustls-native-certs.
    # Identity does not call rustls-pemfile. 2.2.0 is already a thin wrapper
    # over rustls-pki-types PEM code; no patched version exists.
    # Drop this ignore when redis drops the dependency (e.g. after a deliberate
    # redis major upgrade with full regression tests).
    # https://rustsec.org/advisories/RUSTSEC-2025-0134
    "RUSTSEC-2025-0134",
]
