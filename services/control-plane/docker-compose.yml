services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bekratos
      POSTGRES_PASSWORD: bekratos
      POSTGRES_DB: control_plane
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bekratos -d control_plane"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cp_pgdata:/var/lib/postgresql/data

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATABASE_URL: "postgres://bekratos:bekratos@postgres:5432/control_plane"
      LOG_LEVEL: "info"
      MIGRATE_ON_STARTUP: "true"
      BODY_LIMIT_BYTES: "1048576"
      READINESS_TIMEOUT: "2s"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cp_pgdata:
