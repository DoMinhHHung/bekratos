name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "services/identity/**"
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths:
      - "services/identity/**"
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required documentation and workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s .github/workflows/ci.yml
          if [ -d docs ]; then
            find docs -type f -name '*.md' | head -1 | grep -q .
          fi
          echo "Documentation and workflow checks passed."

  rust:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bekratos
          POSTGRES_PASSWORD: bekratos
          POSTGRES_DB: bekratos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bekratos -d bekratos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require identity service manifest
        shell: bash
        run: test -s services/identity/Cargo.toml
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/identity -> target
      - name: Verify lockfile
        shell: bash
        working-directory: services/identity
        run: test -s Cargo.lock
      - name: Format
        working-directory: services/identity
        run: cargo fmt --all -- --check
      - name: Diagnose lockfile update
        working-directory: services/identity
        shell: bash
        run: |
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo metadata --offline --format-version 1 >/dev/null || true
          diff -u /tmp/Cargo.lock.before Cargo.lock || true
          exit 1
      - name: Clippy
        working-directory: services/identity
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check locked build
        env:
          SQLX_OFFLINE: "true"
        working-directory: services/identity
        run: cargo check --locked --all-targets
      - name: Test
        env:
          CI: "true"
          SQLX_OFFLINE: "true"
          DATABASE_URL_TEST: postgres://bekratos:bekratos@localhost:5432/bekratos_test
          REDIS_URL_TEST: redis://localhost:6379
        working-directory: services/identity
        run: cargo test --locked --all-targets
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies
        working-directory: services/identity
        run: cargo audit --deny warnings
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: services/identity
          push: false
          tags: bekratos-identity:ci
