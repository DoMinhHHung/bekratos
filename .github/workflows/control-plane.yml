name: Control Plane CI

on:
  push:
    branches: [main, dev, "feat/**"]
    paths:
      - "services/control-plane/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
    paths:
      - "services/control-plane/**"
      - ".github/workflows/control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/control-plane
    env:
      DATABASE_URL_TEST: postgres://bekratos:bekratos@localhost:5432/control_plane_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bekratos
          POSTGRES_PASSWORD: bekratos
          POSTGRES_DB: control_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bekratos -d control_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/control-plane/go.mod
          cache-dependency-path: services/control-plane/go.sum

      - name: Format & Vet
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code chưa được format chuẩn tại các file sau:"
            gofmt -l .
            exit 1
          fi
          go vet ./...

      - name: Test with Race Detector
        run: go test -race -count=1 ./...

      - name: Build binary
        run: go build -o /tmp/control-plane ./cmd/control-plane

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: services/control-plane
          push: false
          tags: bekratos-control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
